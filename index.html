<style>
:root{--bg:#0a1020;--surface:#101a33;--line:#1f2d52;--text:#e8edf8;--muted:#9aa8c7;--blue:#3b73ff;--cyan:#22d3ee;
--display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;--body:'Instrument Sans','Segoe UI',system-ui,sans-serif}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:72px}
body{margin:0;background:var(--bg);color:var(--text);font:400 1.05rem/1.65 var(--body);overflow-x:hidden}
a{color:inherit}h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0}
:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
.wrap{width:min(1080px,100% - 2.5rem);margin-inline:auto}
section{padding:5.5rem 0}
h2{font-size:clamp(1.8rem,4vw,2.5rem);margin-bottom:2rem;font-weight:700}
.muted{color:var(--muted)}
header{position:sticky;top:0;z-index:20;background:rgba(10,16,32,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
nav{display:flex;align-items:center;gap:1.25rem;height:64px}
.brand{font:700 1.1rem var(--display);text-decoration:none;margin-right:auto}
nav a.l{color:var(--muted);text-decoration:none;font-size:.95rem}nav a.l:hover{color:var(--text)}
.lang{background:none;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:.3rem .7rem;cursor:pointer;font:inherit;font-size:.85rem}
@media(max-width:700px){nav a.l{display:none}}
.btn{display:inline-block;padding:.75rem 1.4rem;border-radius:10px;font-weight:600;text-decoration:none;border:1px solid var(--line);transition:transform .15s,background .15s}
.btn:hover{transform:translateY(-2px)}
.btn.p{background:var(--blue);border-color:var(--blue);color:#fff}.btn.p:hover{background:#5688ff}
.hero{padding:5rem 0 4rem}
.hero-grid{display:grid;gap:3rem;grid-template-columns:1.15fr .85fr;align-items:center}
@media(max-width:860px){.hero-grid{grid-template-columns:1fr}}
.hero h1{font-size:clamp(2.4rem,7vw,4.4rem);font-weight:700;letter-spacing:-.02em}
.hero p{max-width:52ch;color:var(--muted);margin:1.5rem 0 2rem}
.cta{display:flex;flex-wrap:wrap;gap:.8rem}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:1rem}
.chart svg{width:100%;height:auto;display:block}.chart img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;border-radius:10px}.chart figcaption{display:block;color:var(--muted);font-size:.85rem;padding:.55rem .4rem .1rem}.chart img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;border-radius:10px}.chart figcaption{display:block;color:var(--muted);font-size:.85rem;padding:.55rem .4rem .1rem}
.chart small{display:block;color:var(--muted);font-size:.85rem;padding:.25rem .4rem 0}
.about{display:grid;gap:2rem;grid-template-columns:240px 1fr;align-items:start}
.photo{margin:0;aspect-ratio:4/5;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font:700 3rem var(--display);color:var(--blue)}.photo img{width:100%;height:100%;object-fit:cover}
@media(max-width:760px){.photo{max-width:240px}}
@media(max-width:760px){.about{grid-template-columns:1fr}}
.skills{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:1.25rem}
.box h3{font-size:1.05rem;margin-bottom:.7rem}
.tags{display:flex;flex-wrap:wrap;gap:.45rem;padding:0;margin:0;list-style:none}
.tags li{font-size:.85rem;padding:.2rem .65rem;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.skills{grid-template-columns:repeat(auto-fit,minmax(min(100%,310px),1fr));gap:1.25rem}
.skill{padding:0;overflow:hidden;display:flex;flex-direction:column}
.skill svg{width:100%;height:auto;display:block;background:#0c1530;border-bottom:1px solid var(--line)}.skill-photo{width:100%;height:190px;display:block;object-fit:cover;border-bottom:1px solid var(--line)}.skill-photo{width:100%;height:190px;display:block;object-fit:cover;border-bottom:1px solid var(--line)}
.skill .sb{padding:1.25rem;display:flex;flex-direction:column;gap:.8rem}
.skill h4{margin:0;font-size:.95rem;color:var(--cyan);font-weight:600}
.skill ul.can{margin:0;padding-left:1.1rem;color:var(--muted);font-size:.95rem}
.skill ul.can li{margin:.25rem 0}
.projects{display:grid;gap:1.5rem;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.card.main{grid-column:1/-1;border-color:var(--blue)}
.cover{aspect-ratio:16/9;background:linear-gradient(135deg,#14224a,#0d1630);display:grid;place-items:center;font:700 1.6rem var(--display);color:var(--blue)}
.cover img{width:100%;height:100%;object-fit:cover}
.cbody{padding:1.4rem;display:flex;flex-direction:column;gap:.9rem;flex:1}
.cbody h3{font-size:1.4rem}
.status{font-size:.85rem;color:var(--cyan)}
details summary{cursor:pointer;color:var(--muted);font-size:.95rem}
details ul{margin:.6rem 0 0;padding-left:1.2rem;color:var(--muted);font-size:.95rem}
.links{display:flex;gap:.7rem;flex-wrap:wrap;margin-top:auto}
.links a{font-size:.95rem;font-weight:600;color:var(--text);text-decoration:underline;text-decoration-color:var(--blue);text-underline-offset:4px}
.filters{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1.5rem}
.filters button{background:none;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:.35rem 1rem;cursor:pointer;font:inherit;font-size:.9rem}
.filters button[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#fff}
.gallery{display:grid;gap:1rem;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr))}
.gallery button{padding:0;border:1px solid var(--line);background:var(--surface);border-radius:12px;overflow:hidden;cursor:pointer;text-align:left;color:inherit;font:inherit}
.gallery img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.gallery span{display:block;padding:.6rem .8rem;font-size:.9rem}
dialog{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:16px;padding:1rem;width:min(960px,94vw);max-height:92vh}
dialog::backdrop{background:rgba(3,6,15,.85)}
dialog img{width:100%;max-height:68vh;object-fit:contain;display:block;border-radius:8px}
.lbbar{display:flex;gap:.6rem;align-items:center;margin-top:.8rem}.lbbar p{margin:0 auto;font-size:.95rem}
.lbbar button{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:.4rem .9rem;cursor:pointer;font:inherit}
.journey{list-style:none;padding:0;margin:0;display:grid;gap:1rem;max-width:64ch}
.journey li{padding-left:1.2rem;border-left:2px solid var(--blue)}
.journey b{font-family:var(--display);font-size:1.1rem;display:block}
footer{border-top:1px solid var(--line);padding:2rem 0;color:var(--muted);font-size:.9rem}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

<script>
const F='fill="none" stroke="#3b73ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"',C='stroke="#22d3ee"';
const ART={
 py:`<svg viewBox="0 0 160 100" aria-hidden="true"><rect x="8" y="8" width="144" height="84" rx="8" fill="#0d1630" stroke="#1f2d52"/><circle cx="20" cy="19" r="3" fill="#3b73ff"/><circle cx="30" cy="19" r="3" fill="#1f2d52"/><path d="M22 40l12 8-12 8" ${F} ${C}/><path d="M44 48h50M44 62h70M44 76h34" ${F}/></svg>`,
 web:`<svg viewBox="0 0 160 100" aria-hidden="true"><rect x="8" y="8" width="144" height="84" rx="8" fill="#0d1630" stroke="#1f2d52"/><path d="M8 24h144" stroke="#1f2d52"/><circle cx="18" cy="16" r="2.5" fill="#3b73ff"/><rect x="18" y="32" width="38" height="52" rx="4" fill="#14224a"/><rect x="64" y="32" width="78" height="16" rx="4" fill="#3b73ff"/><rect x="64" y="56" width="36" height="28" rx="4" fill="#14224a"/><rect x="106" y="56" width="36" height="28" rx="4" fill="#14224a" stroke="#22d3ee"/></svg>`,
 api:`<svg viewBox="0 0 160 100" aria-hidden="true"><rect x="10" y="34" width="38" height="32" rx="6" fill="#14224a" stroke="#1f2d52"/><rect x="112" y="34" width="38" height="32" rx="6" fill="#14224a" stroke="#1f2d52"/><path d="M52 44h56M108 44l-7-5m7 5l-7 5" ${F}/><path d="M108 58H52M52 58l7-5m-7 5l7 5" ${F} ${C}/><path d="M72 14l8-6 8 6v10c0 8-8 12-8 12s-8-4-8-12z" fill="#0d1630" stroke="#22d3ee" stroke-width="2"/></svg>`,
 db:`<svg viewBox="0 0 160 100" aria-hidden="true"><g fill="#14224a" stroke="#3b73ff" stroke-width="2.5"><path d="M45 26v48c0 7 16 12 35 12s35-5 35-12V26"/><ellipse cx="80" cy="26" rx="35" ry="12"/></g><path d="M45 44c0 7 16 12 35 12s35-5 35-12M45 60c0 7 16 12 35 12s35-5 35-12" fill="none" stroke="#22d3ee" stroke-width="2"/></svg>`,
 ai:`<svg viewBox="0 0 160 100" aria-hidden="true"><g stroke="#1f2d52" stroke-width="2"><path d="M30 25L80 15M30 25L80 50M30 25L80 85M30 75L80 15M30 75L80 50M30 75L80 85M80 15L130 50M80 50L130 50M80 85L130 50"/></g><g fill="#0d1630" stroke="#3b73ff" stroke-width="3"><circle cx="30" cy="25" r="8"/><circle cx="30" cy="75" r="8"/><circle cx="80" cy="15" r="8"/><circle cx="80" cy="50" r="8"/><circle cx="80" cy="85" r="8"/></g><circle cx="130" cy="50" r="10" fill="#22d3ee"/></svg>`,
 cv:`<svg viewBox="0 0 160 100" aria-hidden="true"><rect x="14" y="10" width="132" height="80" rx="8" fill="#0d1630" stroke="#1f2d52"/><path d="M14 80l34-30 26 22 22-18 50 26" ${F}/><circle cx="116" cy="30" r="8" fill="#14224a" stroke="#3b73ff" stroke-width="2"/><rect x="92" y="14" width="48" height="34" rx="3" fill="none" stroke="#22d3ee" stroke-width="2.5" stroke-dasharray="6 4"/></svg>`,
 git:`<svg viewBox="0 0 160 100" aria-hidden="true"><path d="M30 20v60M30 50c0-18 50-8 50-26M80 24v0c0 14 50 6 50 26" ${F}/><g fill="#0d1630" stroke="#3b73ff" stroke-width="3"><circle cx="30" cy="20" r="7"/><circle cx="30" cy="80" r="7"/><circle cx="80" cy="24" r="7"/></g><circle cx="130" cy="50" r="8" fill="#22d3ee"/></svg>`
};
const I18N = {
 en:{nAbout:"About the studio",nSkills:"Our services",nProjects:"Selected work",nGallery:"Gallery",nJourney:"Our approach",nContact:"Contact",
  h1:"Digital solutions that move your organisation forward.",
  lead:"YAV Digital Solutions helps schools, healthcare organisations, shops and businesses build a professional online presence, organise their data and simplify everyday work with useful digital tools.",
  ctaProjects:"Explore our work",ctaContact:"Request a consultation",chartCap:"Websites, applications and digital systems designed around real needs.",
  about1:"YAV Digital Solutions is a digital studio founded by Marcus Tshijika Yav. We work with organisations that want to modernise how they communicate, manage information and serve their customers.",
  about2:"From the first discussion to delivery, the focus stays on your needs: clear proposals, practical solutions, accessible explanations and realistic project scope. Specialist security or regulated healthcare requirements are assessed before work begins.",
  contactText:"Tell us what is slowing your organisation down or what you want to launch. We will discuss a practical digital solution and the next steps.",all:"All",view:"View",code:"Code",demo:"Live demo",details:"Details",close:"Close",can:"What I can do",learn:"Currently learning",learnTxt:"Technologies I study and am working toward. Not claimed as mastered.",nCV:"CV",cvText:"An international-style CV with my photo, skills, projects and contact details. Open it, then save it as PDF.",cvView:"View CV",cvDl:"Download CV (PDF)"},
 fr:{nAbout:"À propos du studio",nSkills:"Nos services",nProjects:"Réalisations",nGallery:"Galerie",nJourney:"Notre approche",nContact:"Contact",
  h1:"Des solutions numériques qui font avancer votre organisation.",
  lead:"YAV Digital Solutions accompagne les écoles, structures de santé, commerces et entreprises pour développer leur présence en ligne, organiser leurs données et simplifier leur travail quotidien grâce à des outils numériques utiles.",
  ctaProjects:"Découvrir nos réalisations",ctaContact:"Demander un devis",chartCap:"Sites web, applications et systèmes numériques conçus pour vos besoins réels.",
  about1:"YAV Digital Solutions est un studio numérique fondé par Marcus Tshijika Yav. Nous accompagnons les organisations qui souhaitent moderniser leur communication, mieux gérer leurs informations et servir leurs clients.",
  about2:"De la première discussion à la livraison, nous partons de vos besoins : propositions claires, solutions pratiques, explications accessibles et périmètre de travail réaliste. Les exigences de sécurité spécialisée ou de santé réglementée sont évaluées avant tout engagement.",
  contactText:"Expliquez-nous ce qui ralentit votre organisation ou le projet que vous souhaitez lancer. Nous étudierons une solution numérique pratique et les prochaines étapes.",all:"Tous",view:"Voir",code:"Code",demo:"Démo en ligne",details:"Détails",close:"Fermer",can:"Ce que je peux faire",learn:"En apprentissage",learnTxt:"Technologies que j’étudie et vers lesquelles je progresse. Non présentées comme maîtrisées.",nCV:"CV",cvText:"Un CV de format international avec ma photo, mes compétences, mes projets et mes coordonnées. Ouvre-le, puis enregistre-le en PDF.",cvView:"Voir le CV",cvDl:"Télécharger le CV (PDF)"}
};

/* ================= App logic ================= */
const $=s=>document.querySelector(s);
let lang=(navigator.language||"en").slice(0,2)==="fr"?"fr":"en";
try{const s=localStorage.getItem("lang");if(s==="fr"||s==="en")lang=s}catch(e){}
let cat="all",lbList=[],lbIdx=0;
const t=k=>I18N[lang][k];
const L=o=>o[lang];

function render(){
  document.documentElement.lang=lang;
  document.querySelectorAll("[data-i]").forEach(e=>e.textContent=t(e.dataset.i));
  $("#lang").textContent=lang==="en"?"FR":"EN";
  $("#gh").href=SITE.github;$("#cvView").href="cv.html?lang="+lang;$("#cvDl").href="cv.html?lang="+lang+"&download=1";
  $("#skillsGrid").innerHTML=SKILLS.map(s=>`<article class="box skill">${s.image?`<img class="skill-photo" src="${s.image}" alt="${s.n[lang]}" loading="lazy" decoding="async">`:ART[s.k]}<div class="sb"><h3>${s.n}</h3><p class="muted" style="margin:0">${L(s.d)}</p><h4>${t("can")}</h4><ul class="can">${s.can[lang].map(x=>`<li>${x}</li>`).join("")}</ul><ul class="tags">${s.tags.map(x=>`<li>${x}</li>`).join("")}</ul></div></article>`).join("")+`<article class="box" style="grid-column:1/-1"><h3>${t("learn")}</h3><p class="muted" style="margin:0 0 .8rem">${t("learnTxt")}</p><ul class="tags">${LEARNING[lang].map(x=>`<li>${x}</li>`).join("")}</ul></article>`;
  $("#projectsGrid").innerHTML=PROJECTS.map(p=>`<article class="card${p.main?" main":""}" id="p-${p.id}">
    <div class="cover">${p.cover?`<img src="${p.cover}" alt="${p.name}" loading="lazy">`:p.name}</div>
    <div class="cbody"><span class="status">${L(p.status)}</span><h3>${p.name}</h3><p class="muted" style="margin:0">${L(p.desc)}</p>
    <ul class="tags">${p.tech.map(x=>`<li>${x}</li>`).join("")}</ul>
    ${p.details?`<details><summary>${t("details")}</summary><ul>${p.details[lang].map(d=>`<li>${d}</li>`).join("")}</ul></details>`:""}
    <div class="links">${p.code?`<a href="${p.code}" target="_blank" rel="noopener">${t("code")}</a>`:""}${p.demo?`<a href="${p.demo}" target="_blank" rel="noopener">${p.id==="grace-divine"?(lang==="fr"?"Déploiement Vercel (accès à confirmer)":"Vercel deployment (access to confirm)"):t("demo")}</a>`:""}</div></div></article>`).join("");
  $("#journeyList").innerHTML=JOURNEY.map(j=>`<li><b>${L(j.t)}</b><span class="muted">${L(j.d)}</span></li>`).join("");
  const c=[`<a class="btn p" href="${SITE.github}" target="_blank" rel="noopener">GitHub</a>`];
  if(SITE.linkedin)c.push(`<a class="btn" href="${SITE.linkedin}" target="_blank" rel="noopener">LinkedIn</a>`);
  if(SITE.email)c.push(`<a class="btn" href="mailto:${SITE.email}">Email</a>`);if(SITE.phone)c.push(`<a class="btn" href="tel:${SITE.phone.replace(/\s/g,'')}">${SITE.phone}</a>`);
  $("#contactLinks").innerHTML=c.join("");
  renderGallery();
}
function renderGallery(){
  const has=GALLERY.length>0;
  $("#gallery").hidden=!has;document.querySelectorAll(".gl").forEach(a=>a.style.display=has?"":"none");
  if(!has)return;
  const cats=["all",...new Set(GALLERY.map(g=>g.category).filter(Boolean))];
  $("#filters").innerHTML=cats.map(k=>`<button aria-pressed="${k===cat}" data-c="${k}">${k==="all"?t("all"):k}</button>`).join("");
  lbList=GALLERY.filter(g=>cat==="all"||g.category===cat);
  $("#galleryGrid").innerHTML=lbList.map((g,i)=>`<button data-n="${i}"><img src="${g.src}" alt="${L(g.title)}" loading="lazy"><span>${L(g.title)}</span></button>`).join("");
}
function showLb(i){
  lbIdx=(i+lbList.length)%lbList.length;const g=lbList[lbIdx];
  $("#lbImg").src=g.src;$("#lbImg").alt=L(g.title);
  const p=PROJECTS.find(x=>x.id===g.project);
  $("#lbCap").textContent=L(g.title)+(p?" — "+p.name:"");
  if(!$("#lb").open)$("#lb").showModal();
}
$("#filters").addEventListener("click",e=>{const b=e.target.closest("button");if(b){cat=b.dataset.c;renderGallery()}});
$("#galleryGrid").addEventListener("click",e=>{const b=e.target.closest("button");if(b)showLb(+b.dataset.n)});
$("#prev").onclick=()=>showLb(lbIdx-1);$("#next").onclick=()=>showLb(lbIdx+1);$("#close").onclick=()=>$("#lb").close();
$("#lb").addEventListener("keydown",e=>{if(e.key==="ArrowLeft")showLb(lbIdx-1);if(e.key==="ArrowRight")showLb(lbIdx+1)});
$("#lb").addEventListener("click",e=>{if(e.target===$("#lb"))$("#lb").close()});
$("#lang").onclick=()=>{lang=lang==="en"?"fr":"en";try{localStorage.setItem("lang",lang)}catch(e){}render()};
$("#yr").textContent=new Date().getFullYear();
(function(){const i=$("#photo"),b=$("#photoBox");i.onerror=()=>{b.textContent="MY"};if(SITE.photo)i.src=SITE.photo;else b.textContent="MY"})();
render();

</script>
</body>
</html>
