<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CV — Marcus Tshijika Yav</title>
<style>
@page{size:A4;margin:12mm}
*{box-sizing:border-box}body{margin:0;background:#e9edf5;font:10.5pt/1.5 'Segoe UI',Arial,sans-serif;color:#1a2233}
.bar{display:flex;gap:.6rem;justify-content:center;flex-wrap:wrap;padding:.8rem}
.bar button{padding:.55rem 1.1rem;border-radius:8px;border:1px solid #3b73ff;background:#3b73ff;color:#fff;font:inherit;cursor:pointer}.bar button.s{background:#fff;color:#1a2233;border-color:#c5cee0}
.page{width:210mm;max-width:100%;margin:0 auto 2rem;background:#fff;padding:14mm;box-shadow:0 4px 20px rgba(0,0,0,.15)}
header{display:flex;gap:1.2rem;align-items:center;border-bottom:2px solid #3b73ff;padding-bottom:.9rem}
.ph{width:30mm;height:38mm;flex:none;border-radius:4px;overflow:hidden;background:#e9edf5;display:grid;place-items:center;font:700 22pt Arial;color:#3b73ff}.ph img{width:100%;height:100%;object-fit:cover}
h1{margin:0;font-size:21pt;line-height:1.15}.t{margin:.2rem 0 .5rem;color:#3b73ff;font-weight:600}
.ct{display:flex;flex-wrap:wrap;gap:.2rem 1rem;font-size:9.5pt}.ct a{color:inherit;text-decoration:none}
h2{font-size:11pt;color:#3b73ff;border-bottom:1px solid #d5dcea;padding-bottom:.15rem;margin:1.1rem 0 .5rem}
.row{margin:0 0 .45rem;break-inside:avoid}.row b{display:block}.m{color:#5b6680;font-size:9.5pt}
@media(max-width:600px){header{flex-direction:column;align-items:flex-start}}
@media print{body{background:#fff}.bar{display:none}.page{box-shadow:none;margin:0;padding:0;width:auto}}
</style></head><body>
<div class="bar"><button id="dl"></button><button class="s" id="sw"></button></div>
<main class="page" id="cv"></main>
<script src="data.js"></script>
<script>
const q=new URLSearchParams(location.search);const lang=q.get("lang")==="fr"?"fr":"en";
const T={en:{sum:"Profile",sk:"Skills",ln:"Currently learning",pr:"Projects",ed:"Education",lg:"Languages",dl:"Download PDF",sw:"Français"},
         fr:{sum:"Profil",sk:"Compétences",ln:"En apprentissage",pr:"Projets",ed:"Formation",lg:"Langues",dl:"Télécharger en PDF",sw:"English"}}[lang];
const u=x=>x.replace(/^https?:\/\/(www\.)?/,"").replace(/\/$/,"");
const ct=[];
if(SITE.whatsapp)ct.push(`<a href="${SITE.whatsapp}" target="_blank" rel="noopener">WhatsApp</a>`);
ct.push(`<a href="${SITE.github}" target="_blank" rel="noopener">GitHub</a>`);
const sec=(h,b)=>b?`<h2>${h}</h2>${b}`:"";
document.getElementById("cv").innerHTML=`<header><div class="ph">${SITE.photo?`<img src="${SITE.photo}" alt="" onerror="this.parentNode.textContent='MY'">`:"MY"}</div>
<div><h1>${NAME}</h1><p class="t">${TITLE[lang]}</p><div class="ct">${ct.map(c=>`<span>${c}</span>`).join("")}</div></div></header>
${sec(T.sum,`<p>${SUMMARY[lang]}</p>`)}
${sec(T.sk,SKILLS.map(s=>`<div class="row"><b>${s.n[lang]}</b><span class="m">${s.tags.join(", ")}</span></div>`).join(""))}
${sec(T.ln,`<span class="m">${LEARNING[lang].join(", ")}</span>`)}
${sec(T.pr,PROJECTS.map(p=>`<div class="row"><b>${p.name} <span class="m">— ${p.status[lang]}</span></b>${p.desc[lang]}<div class="m">${p.tech.join(", ")}${p.code?" · "+u(p.code):""}</div></div>`).join(""))}
${sec(T.ed,EDUCATION.map(e=>`<div class="row"><b>${e.degree[lang]}</b>${e.school} <span class="m">${e.period||""}</span></div>`).join(""))}
${sec(T.lg,LANGUAGES.map(l=>`<div class="row"><b>${l.n[lang]}</b><span class="m">${l.level[lang]}</span></div>`).join(""))}`;
document.title="CV — "+NAME;document.documentElement.lang=lang;
dl.textContent=T.dl;dl.onclick=()=>print();
sw.textContent=T.sw;sw.onclick=()=>location.search="?lang="+(lang==="en"?"fr":"en");
if(q.has("download"))addEventListener("load",()=>setTimeout(print,500));
</script></body></html>
